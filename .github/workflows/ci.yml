name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Install Chromium (Linux needs system libraries too)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Environment
        run: wa-export-pdf --check
      - name: Tests
        run: pytest -q
      - name: Render the sample (artifact for visual review)
        run: wa-export-pdf tests/fixtures/sample_backup out/sample.pdf --me "Rui Costa" --debug --screenshots all
      - uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.os }}-py${{ matrix.python }}
          path: out/
